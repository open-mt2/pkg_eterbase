name: EterBase CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.compiler.cxx }}, ${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++
        build_type: [Release, Debug]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            liblzo2-dev \
            build-essential \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libegl-dev \
            libgl1-mesa-dri

      - name: Configure CMake
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_TESTING=ON

      - name: Build EterBase and Tests
        run: |
          cmake --build build --config ${{ matrix.build_type }} -j$(nproc)

      - name: Run CTest Suite
        run: |
          ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}
